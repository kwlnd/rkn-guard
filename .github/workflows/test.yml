name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -ldflags="-X main.version=dev -X main.branch=$BUILD_BRANCH -X main.repo=$GITHUB_REPOSITORY" -o "$RUNNER_TEMP/rkn-guard" ./cmd
        env:
          BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
      - run: for file in install.sh "app install.sh" tests/integration/*.sh; do bash -n "$file" || exit 1; done
      - run: $RUNNER_TEMP/rkn-guard --help && $RUNNER_TEMP/rkn-guard version
      - run: python3 tests/attack_stats.py
      - name: Реальный ipset в отдельном сетевом пространстве
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ipset
          sudo unshare --net env GITHUB_ACTIONS=true RUNNER_OS=Linux RKN_TEST_BINARY="$RUNNER_TEMP/rkn-guard" bash tests/integration/extra_lists_ipset.sh
